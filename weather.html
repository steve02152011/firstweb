<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時天氣與生活氣象指南</title>
  <meta name="description" content="提供即時天氣、未來7天預報，並結合降雨趨勢、日夜溫差與濕度提供帶傘、穿搭、跑步及夜遊的智慧生活氣象建議。">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3WBLJB6GN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3WBLJB6GN');
  </script>

  <style>
    :root {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.72);
      --card-border: rgba(148, 163, 184, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-green: #a7f3d0;
      --badge-rain: rgba(56, 189, 248, 0.16);
      --badge-warn: rgba(251, 191, 36, 0.16);
      --badge-good: rgba(52, 211, 153, 0.16);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(145deg, var(--bg-gradient-start) 0%, #0b1324 50%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      padding: 20px 16px 48px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    /* Header & Location Bar */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .location-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .city-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .loc-btn {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .loc-btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .back-btn {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text-primary);
      border: 1px solid rgba(148, 163, 184, 0.28);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(148, 163, 184, 0.25);
      border-color: var(--accent);
      color: var(--accent);
    }

    .loc-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .update-time {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Status Message */
    .status-banner {
      display: none;
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fde68a;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .status-banner.show {
      display: block;
    }

    /* Current Weather Hero Card */
    .hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      align-items: center;
    }

    .current-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .weather-icon-lg {
      font-size: 4rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .temp-display {
      font-size: 3.4rem;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .temp-unit {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text-secondary);
      vertical-align: super;
    }

    .weather-desc {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent-green);
      margin-top: 4px;
    }

    .today-range {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .current-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .metric-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* Section Headings */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
    }

    /* Lifestyle Advice Grid */
    .advice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .advice-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .advice-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .advice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .advice-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.02rem;
    }

    .advice-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge-good {
      background: var(--badge-good);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .badge-warn {
      background: var(--badge-warn);
      color: #fcd34d;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .badge-rain {
      background: var(--badge-rain);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .advice-body {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.55;
    }

    .advice-note {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.18);
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    /* 7-Day + Today Forecast List */
    .forecast-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 8px 20px;
      box-shadow: var(--shadow);
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 1.2fr 1.1fr 0.9fr 1.5fr;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      gap: 10px;
    }

    .forecast-row:last-child {
      border-bottom: none;
    }

    .day-name {
      font-weight: 600;
      font-size: 0.96rem;
    }

    .day-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-left: 6px;
    }

    .day-condition {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
    }

    .rain-prob {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.88rem;
      color: #7dd3fc;
      font-weight: 600;
    }

    .rain-prob.low {
      color: var(--text-secondary);
      font-weight: 400;
    }

    .temp-range-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      font-size: 0.92rem;
    }

    .min-temp {
      color: var(--text-secondary);
      width: 36px;
      text-align: right;
    }

    .max-temp {
      font-weight: 700;
      width: 36px;
      text-align: right;
    }

    .temp-bar-bg {
      flex: 1;
      max-width: 90px;
      height: 6px;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .temp-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #fbbf24);
    }

    footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Loading Skeleton */
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    /* Mobile Responsive */
    @media (max-width: 680px) {
      .hero-card {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      .advice-grid {
        grid-template-columns: 1fr;
      }

      .city-title {
        font-size: 1.5rem;
      }

      .temp-display {
        font-size: 2.9rem;
      }

      .forecast-row {
        grid-template-columns: 1.15fr 1fr 0.8fr 1.25fr;
        font-size: 0.88rem;
      }

      .temp-bar-bg {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="appContainer">
    <header>
      <div class="location-group">
        <a href="index.html" class="back-btn" title="返回個人作品集首頁">← 返回首頁</a>
        <h1 class="city-title" id="locationName">📍 台北</h1>
        <button class="loc-btn" id="locateBtn" type="button">
          <span>🧭</span> 使用我的位置
        </button>
      </div>
      <div class="update-time" id="updateTime">載入氣象資料中...</div>
    </header>

    <div class="status-banner" id="statusBanner"></div>

    <!-- Current Weather -->
    <section class="hero-card" aria-label="目前天氣">
      <div class="current-main">
        <div class="weather-icon-lg" id="currentIcon">⛅</div>
        <div>
          <div class="temp-display"><span id="currentTemp">--</span><span class="temp-unit">°C</span></div>
          <div class="weather-desc" id="currentDesc">讀取中</div>
          <div class="today-range" id="todayRange">今日最高 --° / 最低 --°</div>
        </div>
      </div>

      <div class="current-metrics">
        <div class="metric-box">
          <div class="metric-label">體感溫度</div>
          <div class="metric-value" id="apparentTemp">--°C</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">相對濕度</div>
          <div class="metric-value" id="humidity">--%</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">今日降雨機率</div>
          <div class="metric-value" id="todayRainProb">--%</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">雲量 / 風速</div>
          <div class="metric-value" id="cloudWind">--% / -- km/h</div>
        </div>
      </div>
    </section>

    <!-- Smart Lifestyle Advice -->
    <h2 class="section-title">💡 今日生活氣象建議</h2>
    <section class="advice-grid" aria-label="生活建議">
      <article class="advice-card">
        <div>
          <div class="advice-header">
            <div class="advice-title-wrap"><span>☂️</span> 帶傘建議</div>
            <span class="advice-badge badge-rain" id="umbrellaBadge">分析中</span>
          </div>
          <p class="advice-body" id="umbrellaText">正在結合今日降雨機率與季節氣候特徵分析...</p>
        </div>
        <div class="advice-note" id="umbrellaNote"></div>
      </article>

      <article class="advice-card">
        <div>
          <div class="advice-header">
            <div class="advice-title-wrap"><span>👕</span> 穿搭指南</div>
            <span class="advice-badge badge-good" id="outfitBadge">分析中</span>
          </div>
          <p class="advice-body" id="outfitText">正在分析氣溫、濕度與日夜溫差...</p>
        </div>
        <div class="advice-note" id="outfitNote"></div>
      </article>

      <article class="advice-card">
        <div>
          <div class="advice-header">
            <div class="advice-title-wrap"><span>🏃</span> 戶外跑步</div>
            <span class="advice-badge badge-good" id="runBadge">分析中</span>
          </div>
          <p class="advice-body" id="runText">正在評估悶熱指數與濕度舒適度...</p>
        </div>
        <div class="advice-note" id="runNote"></div>
      </article>

      <article class="advice-card">
        <div>
          <div class="advice-header">
            <div class="advice-title-wrap"><span>🌙</span> 夜間出遊</div>
            <span class="advice-badge badge-good" id="nightBadge">分析中</span>
          </div>
          <p class="advice-body" id="nightText">正在評估晚間雲霧能見度與夜溫...</p>
        </div>
        <div class="advice-note" id="nightNote"></div>
      </article>
    </section>

    <!-- Today + Next 7 Days Forecast -->
    <h2 class="section-title">📅 今天與未來 7 天預報</h2>
    <section class="forecast-card" id="forecastList" aria-label="天氣預報列表">
      <!-- Populated by JS -->
    </section>

    <footer>
      氣象資料來源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> 免費開放氣象 API
    </footer>
  </div>

  <script>
    const TAIPEI_COORDS = {
      name: '台北',
      lat: 25.0330,
      lon: 121.5654
    };

    const WEATHER_CODES = {
      0: { text: '晴朗無雲', icon: '☀️' },
      1: { text: '大致晴朗', icon: '🌤️' },
      2: { text: '局部多雲', icon: '⛅' },
      3: { text: '陰天多雲', icon: '☁️' },
      45: { text: '有霧', icon: '🌫️' },
      48: { text: '濃霧結霜', icon: '🌫️' },
      51: { text: '毛毛雨', icon: '🌦️' },
      53: { text: '間歇細雨', icon: '🌦️' },
      55: { text: '密集細雨', icon: '🌧️' },
      56: { text: '凍毛毛雨', icon: '🌧️' },
      57: { text: '強凍細雨', icon: '🌧️' },
      61: { text: '小雨', icon: '🌦️' },
      63: { text: '中雨', icon: '🌧️' },
      65: { text: '大雨', icon: '🌧️' },
      66: { text: '小凍雨', icon: '🌧️' },
      67: { text: '大凍雨', icon: '🌧️' },
      71: { text: '小雪', icon: '🌨️' },
      73: { text: '中雪', icon: '❄️' },
      75: { text: '大雪', icon: '❄️' },
      77: { text: '雪粒', icon: '🌨️' },
      80: { text: '短暫陣雨', icon: '🌦️' },
      81: { text: '陣雨', icon: '🌧️' },
      82: { text: '強陣雨', icon: '⛈️' },
      85: { text: '短暫陣雪', icon: '🌨️' },
      86: { text: '強陣雪', icon: '❄️' },
      95: { text: '雷陣雨', icon: '⛈️' },
      96: { text: '雷雨夾冰雹', icon: '⛈️' },
      99: { text: '強雷雨夾冰雹', icon: '⛈️' }
    };

    function getWeatherInfo(code) {
      return WEATHER_CODES[code] || { text: '多雲時晴', icon: '⛅' };
    }

    function showBanner(msg) {
      const banner = document.getElementById('statusBanner');
      banner.textContent = msg;
      banner.classList.add('show');
    }

    function hideBanner() {
      document.getElementById('statusBanner').classList.remove('show');
    }

    function getSeasonalContext(month) {
      if (month >= 5 && month <= 6) {
        return {
          name: '梅雨季',
          rainHint: '適逢梅雨季節，鋒面徘徊易有突然性的持續降雨。'
        };
      }
      if (month >= 7 && month <= 9) {
        return {
          name: '盛夏與颱風季',
          rainHint: '夏季熱對流旺盛，即使早上晴朗，午後也常有突發雷陣雨。'
        };
      }
      if (month >= 10 && month <= 11) {
        return {
          name: '秋雨與東北季風轉換期',
          rainHint: '秋季東北季風開始增強，迎風面與山區容易出現綿綿秋雨或地形雨。'
        };
      }
      if (month === 12 || month <= 2) {
        return {
          name: '冬季濕冷期',
          rainHint: '冬季受冷氣團與東北季風影響，北部與東部常有細雨濕冷天氣。'
        };
      }
      return {
        name: '春季天氣多變期',
        rainHint: '春季鋒面移動快速，天氣變化大，常有春雨飄落。'
      };
    }

    function generateLifestyleAdvice(data) {
      const current = data.current;
      const daily = data.daily;
      const hourly = data.hourly;

      const now = new Date();
      const month = now.getMonth() + 1;
      const season = getSeasonalContext(month);

      const temp = current.temperature_2m;
      const apparent = current.apparent_temperature;
      const humidity = current.relative_humidity_2m;
      const cloudCover = current.cloud_cover;
      const weatherCode = current.weather_code;

      const todayMax = daily.temperature_2m_max[0];
      const todayMin = daily.temperature_2m_min[0];
      const todayRainProb = daily.precipitation_probability_max[0] ?? 0;
      const todayRainSum = daily.precipitation_sum[0] ?? 0;
      const tempDiff = todayMax - todayMin;

      // 1. 帶傘建議 (結合降雨機率 + 當前月份氣候現象)
      const umbrellaBadge = document.getElementById('umbrellaBadge');
      const umbrellaText = document.getElementById('umbrellaText');
      const umbrellaNote = document.getElementById('umbrellaNote');

      const isRainingNow = [51,53,55,61,63,65,80,81,82,95,96,99].includes(weatherCode);
      if (isRainingNow || todayRainProb >= 60 || todayRainSum >= 2) {
        umbrellaBadge.textContent = '務必帶傘';
        umbrellaBadge.className = 'advice-badge badge-rain';
        umbrellaText.textContent = `今日最高降雨機率達 ${todayRainProb}%，預估累積雨量 ${todayRainSum} mm，出門請隨身攜帶雨具。`;
      } else if (todayRainProb >= 30 || (month >= 5 && month <= 11 && todayRainProb >= 20)) {
        umbrellaBadge.textContent = '建議備傘';
        umbrellaBadge.className = 'advice-badge badge-warn';
        umbrellaText.textContent = `今日降雨機率約 ${todayRainProb}%，雖非整天大雨，但放一把折疊傘在包包裡最安心。`;
      } else {
        umbrellaBadge.textContent = '免帶雨具';
        umbrellaBadge.className = 'advice-badge badge-good';
        umbrellaText.textContent = `今日降雨機率僅 ${todayRainProb}%，天氣相對穩定，白天可以輕鬆出門；若日照強可改帶遮陽傘。`;
      }
      umbrellaNote.textContent = `季節提醒（${month}月・${season.name}）：${season.rainHint}`;

      // 2. 穿搭建議 (溫度 + 濕氣 + 日夜溫差)
      const outfitBadge = document.getElementById('outfitBadge');
      const outfitText = document.getElementById('outfitText');
      const outfitNote = document.getElementById('outfitNote');

      let baseClothes = '';
      if (temp >= 29) {
        baseClothes = '氣溫炎熱，建議穿著透氣排汗的短袖、棉麻或機能涼感衣物';
      } else if (temp >= 23) {
        baseClothes = '氣溫溫暖舒適，短袖或薄長袖單穿即可';
      } else if (temp >= 17) {
        baseClothes = '體感微涼，建議長袖上衣搭配薄外套或針織衫';
      } else {
        baseClothes = '氣溫偏冷，建議採用保暖內搭加上防風外套或大衣';
      }

      let diffAdvice = '';
      if (tempDiff >= 7) {
        outfitBadge.textContent = '洋蔥式穿搭';
        outfitBadge.className = 'advice-badge badge-warn';
        diffAdvice = `；今日日夜溫差高達 ${tempDiff.toFixed(1)}°C（${todayMin.toFixed(0)}°~${todayMax.toFixed(0)}°），早晚偏涼，務必多帶一件好穿脫的外套。`;
      } else {
        outfitBadge.textContent = temp >= 26 ? '清爽透氣' : (temp >= 18 ? '舒適好搭' : '注意保暖');
        outfitBadge.className = 'advice-badge badge-good';
        diffAdvice = `；今日溫差約 ${tempDiff.toFixed(1)}°C，溫度變化平穩。`;
      }

      const humidityClothes = humidity >= 80
        ? `目前相對濕度 ${humidity}% 偏高，衣物容易感覺黏膩或微潮，優先選快乾材質。`
        : `目前濕度 ${humidity}% 適中，體感乾爽舒適。`;

      outfitText.textContent = baseClothes + diffAdvice;
      outfitNote.textContent = humidityClothes;

      // 3. 戶外跑步建議 (濕度 + 悶熱程度)
      const runBadge = document.getElementById('runBadge');
      const runText = document.getElementById('runText');
      const runNote = document.getElementById('runNote');

      const isMuggy = apparent >= 31 || (temp >= 27 && humidity >= 75);
      const isTooHumid = humidity >= 85;

      if (isRainingNow) {
        runBadge.textContent = '建議室內運動';
        runBadge.className = 'advice-badge badge-warn';
        runText.textContent = '目前正在下雨，路面濕滑且能見度較差，建議改為室內跑步機或核心訓練。';
      } else if (isMuggy) {
        runBadge.textContent = '悶熱易中暑';
        runBadge.className = 'advice-badge badge-warn';
        runText.textContent = `目前體感溫度 ${apparent.toFixed(1)}°C、濕度 ${humidity}%，空氣又濕又悶，汗水不易蒸發，建議改在清晨或傍晚並降低配速。`;
      } else if (isTooHumid) {
        runBadge.textContent = '空氣潮濕';
        runBadge.className = 'advice-badge badge-warn';
        runText.textContent = `空氣濕度高達 ${humidity}%，呼吸與體感會稍微沉重，跑前請充分熱身並注意補水。`;
      } else if (temp >= 14 && temp <= 25) {
        runBadge.textContent = '極佳跑步天';
        runBadge.className = 'advice-badge badge-good';
        runText.textContent = `氣溫 ${temp.toFixed(1)}°C 搭配 ${humidity}% 濕度，空氣清爽不悶熱，非常適合戶外長跑或間歇訓練！`;
      } else {
        runBadge.textContent = '尚可跑步';
        runBadge.className = 'advice-badge badge-good';
        runText.textContent = temp < 14
          ? `氣溫 ${temp.toFixed(1)}°C 偏涼，起跑前請延長暖身時間並注意頭部與四肢保暖。`
          : `氣溫 ${temp.toFixed(1)}°C 略高，但濕度 ${humidity}% 尚可，記得每 20 分鐘補充水分。`;
      }
      runNote.textContent = `即時指標：體感 ${apparent.toFixed(1)}°C ／ 相對濕度 ${humidity}%`;

      // 4. 晚上適不適合出去夜遊 (分析今晚 18:00~23:00 的雲霧、降雨與溫度)
      const nightBadge = document.getElementById('nightBadge');
      const nightText = document.getElementById('nightText');
      const nightNote = document.getElementById('nightNote');

      let eveningTemps = [];
      let eveningClouds = [];
      let eveningVisibility = [];
      let eveningCodes = [];

      if (hourly && hourly.time) {
        for (let i = 0; i < Math.min(24, hourly.time.length); i++) {
          const hour = parseInt(hourly.time[i].slice(11, 13), 10);
          if (hour >= 18 && hour <= 23) {
            eveningTemps.push(hourly.temperature_2m[i]);
            eveningClouds.push(hourly.cloud_cover[i]);
            if (hourly.visibility) eveningVisibility.push(hourly.visibility[i]);
            eveningCodes.push(hourly.weather_code[i]);
          }
        }
      }

      const avgNightTemp = eveningTemps.length
        ? eveningTemps.reduce((a, b) => a + b, 0) / eveningTemps.length
        : todayMin + 2;
      const avgNightCloud = eveningClouds.length
        ? eveningClouds.reduce((a, b) => a + b, 0) / eveningClouds.length
        : cloudCover;
      const minNightVis = eveningVisibility.length
        ? Math.min(...eveningVisibility)
        : 10000;

      const hasNightFog = eveningCodes.some(c => c === 45 || c === 48) || minNightVis < 3000;
      const hasNightRain = eveningCodes.some(c => [51,53,55,61,63,65,80,81,82,95,96,99].includes(c));

      if (hasNightRain) {
        nightBadge.textContent = '不宜夜遊';
        nightBadge.className = 'advice-badge badge-rain';
        nightText.textContent = `今晚預報有雨，夜間視線與路面條件不佳，建議改安排室內夜景餐廳或改日再出發。`;
      } else if (hasNightFog) {
        nightBadge.textContent = '留意濃霧';
        nightBadge.className = 'advice-badge badge-warn';
        nightText.textContent = `今晚能見度偏低且易起霧，若前往山區或郊外夜遊、看夜景，行車務必開啟霧燈並減速慢行。`;
      } else if (avgNightTemp < 14) {
        nightBadge.textContent = '偏冷注意保暖';
        nightBadge.className = 'advice-badge badge-warn';
        nightText.textContent = `今晚氣溫約 ${avgNightTemp.toFixed(1)}°C 偏冷，雲量約 ${Math.round(avgNightCloud)}%，市區散步尚可，但上山吹風會非常寒冷。`;
      } else if (avgNightCloud <= 45) {
        nightBadge.textContent = '絕佳夜遊夜衝';
        nightBadge.className = 'advice-badge badge-good';
        nightText.textContent = `今晚雲量僅約 ${Math.round(avgNightCloud)}%、無霧且氣溫約 ${avgNightTemp.toFixed(1)}°C 舒適宜人，能見度極佳，非常適合看夜景或觀星！`;
      } else {
        nightBadge.textContent = '適合夜間散步';
        nightBadge.className = 'advice-badge badge-good';
        nightText.textContent = `今晚雲層稍多（約 ${Math.round(avgNightCloud)}%），雖不易看到滿天星斗，但無霧且氣溫約 ${avgNightTemp.toFixed(1)}°C，很適合夜市逛街或河濱夜遊。`;
      }
      nightNote.textContent = `今晚預估：均溫 ${avgNightTemp.toFixed(1)}°C ／ 雲量 ${Math.round(avgNightCloud)}% ／ 最低能見度 ${(minNightVis / 1000).toFixed(1)} km`;
    }

    function renderForecast(daily) {
      const listEl = document.getElementById('forecastList');
      listEl.innerHTML = '';

      const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const totalDays = Math.min(8, daily.time.length); // 今天 + 未來 7 天

      const allMins = daily.temperature_2m_min.slice(0, totalDays);
      const allMaxs = daily.temperature_2m_max.slice(0, totalDays);
      const globalMin = Math.min(...allMins);
      const globalMax = Math.max(...allMaxs);
      const globalSpan = Math.max(1, globalMax - globalMin);

      for (let i = 0; i < totalDays; i++) {
        const dateStr = daily.time[i];
        const dateObj = new Date(dateStr + 'T00:00:00');
        const monthDay = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        const dayLabel = i === 0 ? '今天' : (i === 1 ? '明天' : weekDays[dateObj.getDay()]);

        const code = daily.weather_code[i];
        const info = getWeatherInfo(code);
        const rainProb = daily.precipitation_probability_max[i] ?? 0;
        const rainSum = daily.precipitation_sum[i] ?? 0;
        const minT = daily.temperature_2m_min[i];
        const maxT = daily.temperature_2m_max[i];

        const willRain = rainProb >= 30 || rainSum >= 1;
        const rainText = willRain ? `💧 ${rainProb}%` : `☔ ${rainProb}%`;

        const leftPct = ((minT - globalMin) / globalSpan) * 100;
        const widthPct = Math.max(8, ((maxT - minT) / globalSpan) * 100);

        const row = document.createElement('div');
        row.className = 'forecast-row';
        row.innerHTML = `
          <div>
            <span class="day-name">${dayLabel}</span>
            <span class="day-date">${monthDay}</span>
          </div>
          <div class="day-condition">
            <span>${info.icon}</span>
            <span>${info.text}</span>
          </div>
          <div>
            <span class="rain-prob ${willRain ? '' : 'low'}" title="${willRain ? '有機會下雨' : '降雨機率低'}">
              ${rainText}
            </span>
          </div>
          <div class="temp-range-wrap">
            <span class="min-temp">${Math.round(minT)}°</span>
            <div class="temp-bar-bg">
              <div class="temp-bar-fill" style="left: ${leftPct}%; width: ${widthPct}%;"></div>
            </div>
            <span class="max-temp">${Math.round(maxT)}°</span>
          </div>
        `;
        listEl.appendChild(row);
      }
    }

    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=zh-TW`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Reverse geocode failed');
        const data = await res.json();
        const addr = data.address || {};
        const city = addr.city || addr.county || addr.town || addr.suburb || '';
        const district = addr.suburb || addr.town || addr.district || '';
        if (city && district && city !== district) {
          return `${city} ${district}`;
        }
        return city || district || `目前位置 (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
      } catch (e) {
        return `目前位置 (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
      }
    }

    async function loadWeather(lat, lon, displayName) {
      const container = document.getElementById('appContainer');
      container.classList.add('loading');

      try {
        const params = new URLSearchParams({
          latitude: lat,
          longitude: lon,
          current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,cloud_cover,wind_speed_10m',
          hourly: 'temperature_2m,cloud_cover,visibility,weather_code',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max',
          timezone: 'auto',
          forecast_days: 8
        });

        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
        if (!response.ok) throw new Error('無法取得 Open-Meteo 氣象資料');
        const data = await response.json();

        // Update UI Header
        document.getElementById('locationName').textContent = `📍 ${displayName}`;
        const nowStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('updateTime').textContent = `更新時間：${nowStr}`;

        // Update Current Card
        const current = data.current;
        const daily = data.daily;
        const currentInfo = getWeatherInfo(current.weather_code);

        document.getElementById('currentIcon').textContent = currentInfo.icon;
        document.getElementById('currentTemp').textContent = Math.round(current.temperature_2m);
        document.getElementById('currentDesc').textContent = currentInfo.text;
        document.getElementById('todayRange').textContent =
          `今日最高 ${Math.round(daily.temperature_2m_max[0])}° / 最低 ${Math.round(daily.temperature_2m_min[0])}°`;

        document.getElementById('apparentTemp').textContent = `${current.apparent_temperature.toFixed(1)}°C`;
        document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
        document.getElementById('todayRainProb').textContent = `${daily.precipitation_probability_max[0] ?? 0}%`;
        document.getElementById('cloudWind').textContent = `${current.cloud_cover}% / ${Math.round(current.wind_speed_10m)} km/h`;

        // Generate Advice & 8-day (Today + 7 days) Forecast
        generateLifestyleAdvice(data);
        renderForecast(daily);
        hideBanner();
      } catch (err) {
        showBanner('⚠️ 讀取天氣資料失敗，請檢查網路連線後再試一次。');
        console.error(err);
      } finally {
        container.classList.remove('loading');
      }
    }

    document.getElementById('locateBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showBanner('⚠️ 您的瀏覽器不支援地理定位功能。');
        return;
      }

      const btn = document.getElementById('locateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> 定位中...';

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          const placeName = await reverseGeocode(latitude, longitude);
          await loadWeather(latitude, longitude, placeName);
          btn.disabled = false;
          btn.innerHTML = '<span>🧭</span> 使用我的位置';
        },
        (error) => {
          let msg = '無法取得您的位置，目前維持顯示台北天氣。';
          if (error.code === error.PERMISSION_DENIED) {
            msg = '您已拒絕位置存取權限，請在瀏覽器設定中允許定位，或繼續瀏覽台北天氣。';
          }
          showBanner(`⚠️ ${msg}`);
          btn.disabled = false;
          btn.innerHTML = '<span>🧭</span> 使用我的位置';
        },
        { timeout: 10000 }
      );
    });

    // Initial load: Taipei
    loadWeather(TAIPEI_COORDS.lat, TAIPEI_COORDS.lon, TAIPEI_COORDS.name);
  </script>
